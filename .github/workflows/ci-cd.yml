name : CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Dependencies
        run: |
          pip install -r requirement.txt
        
      - name: Run Tests
        run: |
          pytest
      
      - name: Build Container
        run: |
          docker build -t spotify-recommender .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps: 
      - name: Trigger Render Deployement
        run: |
          curl ${{secrets.RENDER_DEPLOY_HOOK}}
